<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Tracker</title>

<!-- iOS Home Screen App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">

<!-- Inline SVG app icon -->
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%230d0d0d' rx='40'/><text x='50%25' y='50%25' font-family='Arial Black, sans-serif' font-size='90' font-weight='900' fill='%23c6ff3a' text-anchor='middle' dominant-baseline='central'>DT</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface-hi: #1f1f1f;
    --line: #2a2a2a;
    --text: #f0f0f0;
    --dim: #888;
    --accent: #c6ff3a;
    --warn: #ff6b3a;
    --ok: #4ade80;
    --protein: #60a5fa;
    --carbs: #fbbf24;
    --fat: #f472b6;
  }
  body {
    font-family: 'Archivo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(80px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 560px; margin: 0 auto; }

  header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  h1 {
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .day-nav { display: flex; gap: 6px; margin-top: 12px; }
  .day-nav button {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    flex: 1;
    text-transform: uppercase;
    line-height: 1.4;
  }
  .day-nav button.today {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }

  .section { margin-bottom: 18px; }
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 4px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .totals { background: var(--surface); border: 1px solid var(--line); padding: 14px; }
  .totals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .macro { text-align: center; }
  .macro-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .macro-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .macro-target { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim); margin-top: 2px; }
  .macro-bar { height: 4px; background: var(--bg); margin-top: 6px; overflow: hidden; position: relative; }
  .macro-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.3s; }
  .macro.cal .macro-value { color: var(--accent); }
  .macro.cal .macro-bar-fill { background: var(--accent); }
  .macro.p .macro-value { color: var(--protein); }
  .macro.p .macro-bar-fill { background: var(--protein); }
  .macro.c .macro-value { color: var(--carbs); }
  .macro.c .macro-bar-fill { background: var(--carbs); }
  .macro.f .macro-value { color: var(--fat); }
  .macro.f .macro-bar-fill { background: var(--fat); }
  .over { color: var(--warn) !important; }

  .meal { background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; overflow: hidden; }
  .meal.logged { border-color: var(--accent); }
  .meal-header { display: flex; align-items: center; padding: 12px 14px; cursor: pointer; gap: 12px; }
  .meal-status { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .meal.logged .meal-status { background: var(--accent); }
  .meal-info { flex: 1; min-width: 0; }
  .meal-title { font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
  .meal-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .meal-quick { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); text-align: right; line-height: 1.4; }
  .meal-quick .cals { color: var(--accent); font-weight: 700; font-size: 13px; }
  .meal-quick .macros-mini { font-size: 10px; }

  .meal-body { display: none; border-top: 1px solid var(--line); padding: 14px; }
  .meal.open .meal-body { display: block; }

  .quick-fill { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .quick-fill button {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .quick-fill button:hover { border-color: var(--accent); color: var(--accent); }

  .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .input-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .input-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    text-align: center;
  }
  .input-field input:focus { outline: none; border-color: var(--accent); }
  .input-field.p input { border-left: 3px solid var(--protein); }
  .input-field.c input { border-left: 3px solid var(--carbs); }
  .input-field.f input { border-left: 3px solid var(--fat); }
  .input-field.cal input { border-left: 3px solid var(--accent); }

  .note-field {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px;
    font-family: 'Archivo', sans-serif;
    font-size: 12px;
    margin-bottom: 10px;
    resize: vertical;
    min-height: 36px;
  }
  .note-field:focus { outline: none; border-color: var(--accent); }

  .meal-actions { display: flex; gap: 6px; }
  .meal-actions button {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .meal-actions button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .meal-actions button.danger { color: var(--warn); }

  .training { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .training-card { background: var(--surface); border: 1px solid var(--line); padding: 10px; cursor: pointer; }
  .training-card.done { background: linear-gradient(135deg, rgba(74,222,128,0.12), var(--surface)); border-color: var(--ok); }
  .training-card.scheduled { border-color: var(--accent); }
  .training-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .training-card.scheduled .training-type { color: var(--accent); }
  .training-card.done .training-type { color: var(--ok); }
  .training-detail { font-size: 12px; font-weight: 600; margin-top: 2px; text-transform: uppercase; }
  .training-status { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--dim); margin-top: 4px; }

  .weight-row { background: var(--surface); border: 1px solid var(--line); padding: 12px; display: flex; align-items: center; gap: 10px; }
  .weight-input {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    width: 80px;
  }
  .weight-input:focus { outline: none; border-color: var(--accent); }
  .weight-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim); text-transform: uppercase; }
  .weight-progress { flex: 1; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim); }
  .weight-progress .num { color: var(--accent); font-size: 13px; font-weight: 700; }

  .history-row {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    gap: 10px;
  }
  .history-date { color: var(--dim); width: 60px; flex-shrink: 0; }
  .history-bar { flex: 1; height: 6px; background: var(--bg); border: 1px solid var(--line); position: relative; }
  .history-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .history-bar-fill.over { background: var(--warn); }
  .history-cal { width: 70px; text-align: right; flex-shrink: 0; color: var(--text); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--line); padding: 20px; max-width: 400px; width: 100%; }
  .modal h3 { font-weight: 800; font-size: 16px; text-transform: uppercase; margin-bottom: 14px; }

  .loading { color: var(--dim); text-align: center; padding: 40px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  /* Rules card */
  .rules-card {
    background: var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .rules-header {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .rules-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rules-title {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .rules-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--bg);
    background: var(--accent);
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  .rules-chevron {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--dim);
    transition: transform 0.2s;
  }
  .rules-card.open .rules-chevron { transform: rotate(180deg); }
  .rules-body {
    display: none;
    border-top: 1px solid var(--line);
    padding: 14px;
  }
  .rules-card.open .rules-body { display: block; }
  .rules-section {
    margin-bottom: 14px;
  }
  .rules-section:last-child { margin-bottom: 0; }
  .rules-section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }
  .rule-line {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 6px 0;
    font-size: 12px;
    line-height: 1.4;
  }
  .rule-line + .rule-line { border-top: 1px solid var(--line); }
  .rule-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
    width: 50px;
    text-transform: uppercase;
    padding-top: 1px;
  }
  .rule-tag.warn { color: var(--warn); }
  .rule-text { flex: 1; color: var(--text); }
  .rule-text strong { color: var(--accent); font-weight: 600; }
  .rule-text .strike { text-decoration: line-through; color: var(--dim); }

  .schedule-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    font-size: 11px;
  }
  .schedule-row + .schedule-row { border-top: 1px solid var(--line); }
  .schedule-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
  }
  .schedule-row.today .schedule-day { color: var(--bg); background: var(--accent); padding: 2px 4px; text-align: center; }
  .schedule-meal {
    color: var(--text);
    line-height: 1.3;
  }
  .schedule-meal .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 1px;
  }
  .schedule-row.free .schedule-meal { color: var(--dim); font-style: italic; }

  /* Drinks */
  .drinks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .drink-card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    user-select: none;
    transition: all 0.12s;
    position: relative;
  }
  .drink-card:active { transform: scale(0.97); }
  .drink-card.has-count { border-color: var(--accent); background: linear-gradient(180deg, rgba(198,255,58,0.08), var(--surface)); }
  .drink-short {
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .drink-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    margin-top: 3px;
  }
  .drink-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 6px;
    line-height: 1;
    min-height: 22px;
  }
  .drink-count.zero { color: var(--line); }
  .drink-minus {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--dim);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .drink-card.has-count .drink-minus { display: flex; }
  .drink-minus:hover { color: var(--warn); border-color: var(--warn); }

  .drink-card.eating-out.has-count {
    border-color: var(--warn);
    background: linear-gradient(180deg, rgba(255,107,58,0.1), var(--surface));
  }
  .drink-card.eating-out.has-count .drink-count { color: var(--warn); }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading">LOADING...</div>
</div>

<div class="modal-overlay" id="targets-modal">
  <div class="modal">
    <h3>Daily Targets</h3>
    <div class="input-grid">
      <div class="input-field cal"><label>Cals</label><input type="number" id="t-cal"></div>
      <div class="input-field p"><label>Protein</label><input type="number" id="t-p"></div>
      <div class="input-field c"><label>Carbs</label><input type="number" id="t-c"></div>
      <div class="input-field f"><label>Fat</label><input type="number" id="t-f"></div>
    </div>
    <div class="meal-actions" style="margin-top:14px;">
      <button id="t-cancel">Cancel</button>
      <button class="primary" id="t-save">Save</button>
    </div>
  </div>
</div>

<script>

  { id: 'yopro', label: 'YoPro pouch', short: 'YoPro', cal: 94, p: 15, c: 7, f: 0.5 },

const EATING_OUT_PRESETS = [
  { id: 'subway', label: 'Subway footlong (crumbed chk)', short: 'Subway', cal: 850, p: 50, c: 95, f: 28 },

// Storage layer — uses window.storage in Claude sandbox, falls back to localStorage in Safari/standalone
const storage = {
  async get(key) {
    if (window.storage) {
      try { return await window.storage.get(key); } catch { return null; }
    }
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value) {
    if (window.storage) {
      try { return await window.storage.set(key, value); } catch {}
    }
    localStorage.setItem(key, value);
  },
};

async function loadDay(k) { try { const r = await storage.get(`day:${k}`); return r ? JSON.parse(r.value) : null; } catch { return null; } }
async function saveDayData(k, d) { try { await storage.set(`day:${k}`, JSON.stringify(d)); } catch (e) { console.error(e); } }
async function loadTargets() { try { const r = await storage.get('targets'); return r ? JSON.parse(r.value) : DEFAULT_TARGETS; } catch { return DEFAULT_TARGETS; } }
async function saveTargets(t) { try { await storage.set('targets', JSON.stringify(t)); } catch (e) { console.error(e); } }
async function loadWeight() { try { const r = await storage.get('weight:current'); return r ? parseFloat(r.value) : null; } catch { return null; } }
async function saveWeight(w) { try { await storage.set('weight:current', String(w)); } catch (e) { console.error(e); } }

function dateKey(d) { return d.toISOString().slice(0, 10); }
function formatDate(d) { return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'short' }).toUpperCase(); }

// Build Mon-Sun week array starting from current week's Monday
function getCurrentWeek() {
  const today = new Date();
  const dow = today.getDay();
  const daysFromMonday = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysFromMonday);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function getMealsForDay(date) {
  const dow = date.getDay();
  return MEAL_SLOTS.map(slot => ({ ...slot, presets: slot.id === 'dinner' ? getDinnerPresets(dow) : slot.presets }));
}

function computeTotals() {
  let cal = 0, p = 0, c = 0, f = 0;
  for (const slot of MEAL_SLOTS) {
    const e = dayData[slot.id];
    if (e && e.logged) {
      cal += Number(e.cal) || 0;
      p += Number(e.p) || 0;
      c += Number(e.c) || 0;
      f += Number(e.f) || 0;
    }
  }
  const breakfast = dayData.breakfast_items || {};
  for (const item of BREAKFAST_PRESETS) {
    const count = breakfast[item.id] || 0;
    cal += count * item.cal;
    p += count * item.p;
    c += count * item.c;
    f += count * item.f;
  }
  const drinks = dayData.drinks || {};
  for (const drink of DRINK_PRESETS) {
    const count = drinks[drink.id] || 0;
    cal += count * drink.cal;
    p += count * drink.p;
    c += count * drink.c;
    f += count * drink.f;
  }
  const snacks = dayData.snacks || {};
  for (const snack of SNACK_PRESETS) {
    const count = snacks[snack.id] || 0;
    cal += count * snack.cal;
    p += count * snack.p;
    c += count * snack.c;
    f += count * snack.f;
  }
  const eatingOut = dayData.eating_out || {};
  for (const item of EATING_OUT_PRESETS) {
    const count = eatingOut[item.id] || 0;
    cal += count * item.cal;
    p += count * item.p;
    c += count * item.c;
    f += count * item.f;
  }
  return { cal, p, c, f };
}

    });
  });

  app.querySelectorAll('[data-breakfast]').forEach(card => {
    const itemId = card.dataset.breakfast;
    card.addEventListener('click', async (e) => {
      if (e.target.dataset.breakfastMinus) return;
      dayData.breakfast_items = dayData.breakfast_items || {};
      dayData.breakfast_items[itemId] = (dayData.breakfast_items[itemId] || 0) + 1;
      await persistDay();
      render();
    });
  });
  app.querySelectorAll('[data-breakfast-minus]').forEach(btn => {
    const itemId = btn.dataset.breakfastMinus;
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!dayData.breakfast_items || !dayData.breakfast_items[itemId]) return;
      dayData.breakfast_items[itemId] -= 1;
      if (dayData.breakfast_items[itemId] <= 0) delete dayData.breakfast_items[itemId];
      await persistDay();
      render();
    });
  });

  app.querySelectorAll('[data-snack]').forEach(card => {
    const snackId = card.dataset.snack;
    card.addEventListener('click', async (e) => {
      if (e.target.dataset.snackMinus) return;
      dayData.snacks = dayData.snacks || {};
      dayData.snacks[snackId] = (dayData.snacks[snackId] || 0) + 1;
      await persistDay();
      render();
    });
  });
  app.querySelectorAll('[data-snack-minus]').forEach(btn => {
    const snackId = btn.dataset.snackMinus;
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!dayData.snacks || !dayData.snacks[snackId]) return;
      dayData.snacks[snackId] -= 1;
      if (dayData.snacks[snackId] <= 0) delete dayData.snacks[snackId];
      await persistDay();
      render();
    });
  });

  app.querySelectorAll('[data-eatingout]').forEach(card => {
    const itemId = card.dataset.eatingout;
    card.addEventListener('click', async (e) => {
      if (e.target.dataset.eatingoutMinus) return;
      dayData.eating_out = dayData.eating_out || {};
      dayData.eating_out[itemId] = (dayData.eating_out[itemId] || 0) + 1;
      await persistDay();
      render();
    });
  });
  app.querySelectorAll('[data-eatingout-minus]').forEach(btn => {
    const itemId = btn.dataset.eatingoutMinus;
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!dayData.eating_out || !dayData.eating_out[itemId]) return;
      dayData.eating_out[itemId] -= 1;
      if (dayData.eating_out[itemId] <= 0) delete dayData.eating_out[itemId];
      await persistDay();
      render();
    });
  });

  const trainingToggle = app.querySelector('[data-training="toggle"]');
  if (trainingToggle) {
    trainingToggle.addEventListener('click', async () => {
      dayData.training = dayData.training || {};
      dayData.training.done = !dayData.training.done;
      await persistDay();
      render();
    });
  }
  const trainingNote = app.querySelector('[data-training="note"]');
  if (trainingNote) {
    trainingNote.addEventListener('click', async () => {
      const note = prompt('Training notes:', dayData.training?.note || '');
      if (note !== null) {
        dayData.training = dayData.training || {};
        dayData.training.note = note;
        await persistDay();
        render();
      }
    });
  }

  const weightInput = document.getElementById('weight-input');
  if (weightInput) {
    weightInput.addEventListener('change', async () => {
      const v = parseFloat(weightInput.value);
      if (!isNaN(v) && v > 0) {
        currentWeight = v;
        await saveWeight(v);
        dayData.weight = v;
        await persistDay();
        render();
      }
    });
  }

  document.getElementById('edit-targets').addEventListener('click', () => {
    document.getElementById('t-cal').value = targets.cal;
    document.getElementById('t-p').value = targets.p;
    document.getElementById('t-c').value = targets.c;
    document.getElementById('t-f').value = targets.f;
    document.getElementById('targets-modal').classList.add('show');
  });

  const rulesCard = document.getElementById('rules-card');
  const rulesToggle = document.getElementById('rules-toggle');
  if (rulesOpen) rulesCard.classList.add('open');
  rulesToggle.addEventListener('click', async () => {
    rulesOpen = !rulesOpen;
    rulesCard.classList.toggle('open');
    try { await storage.set('ui:rules_open', String(rulesOpen)); } catch {}
  });
  const todayDowStr = String(currentDate.getDay());
  const todayRow = rulesCard.querySelector(`[data-dow="${todayDowStr}"]`);
  if (todayRow) todayRow.classList.add('today');
}

document.getElementById('t-cancel').addEventListener('click', () => {
  document.getElementById('targets-modal').classList.remove('show');
});
document.getElementById('t-save').addEventListener('click', async () => {
  targets = {
    cal: parseFloat(document.getElementById('t-cal').value) || DEFAULT_TARGETS.cal,
    p: parseFloat(document.getElementById('t-p').value) || DEFAULT_TARGETS.p,
    c: parseFloat(document.getElementById('t-c').value) || DEFAULT_TARGETS.c,
    f: parseFloat(document.getElementById('t-f').value) || DEFAULT_TARGETS.f,
  };
  await saveTargets(targets);
  document.getElementById('targets-modal').classList.remove('show');
  render();
});

async function persistDay() {
  await saveDayData(dateKey(currentDate), dayData);
  await loadHistory();
}

async function refreshDay() {
  dayData = await loadDay(dateKey(currentDate)) || {};
  await loadHistory();
  render();
}

async function loadHistory() {
  const week = getCurrentWeek();
  const days = [];
  for (const d of week) {
    const data = await loadDay(dateKey(d));
    let cal = 0;
    if (data) {
      for (const slot of MEAL_SLOTS) {
        if (data[slot.id]?.logged) cal += Number(data[slot.id].cal) || 0;
      }
      if (data.breakfast_items) {
        for (const item of BREAKFAST_PRESETS) {
          const count = data.breakfast_items[item.id] || 0;
          cal += count * item.cal;
        }
      }
      if (data.drinks) {
        for (const drink of DRINK_PRESETS) {
          const count = data.drinks[drink.id] || 0;
          cal += count * drink.cal;
        }
      }
      if (data.snacks) {
        for (const snack of SNACK_PRESETS) {
          const count = data.snacks[snack.id] || 0;
          cal += count * snack.cal;
        }
      }
      if (data.eating_out) {
        for (const item of EATING_OUT_PRESETS) {
          const count = data.eating_out[item.id] || 0;
          cal += count * item.cal;
        }
      }
    }
    days.push({ label: DAYS_SHORT[d.getDay()] + ' ' + d.getDate(), cal });
  }
  history = days;
}

async function init() {
  targets = await loadTargets();
  currentWeight = await loadWeight();
  try {
    const r = await storage.get('ui:rules_open');
    rulesOpen = r?.value === 'true';
  } catch { rulesOpen = false; }
  await refreshDay();
}
init();
</script>
</body>
</html>
